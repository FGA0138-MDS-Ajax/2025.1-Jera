services:

  db:
    image: postgres
    env_file:
      - .env
    ports:
      - 5432:5432
    networks:
      - jera

  api:
    env_file:
      - .env
    build:
      context: ./backend/
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "20"
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - jera

  frontend:
    build:
      context: ./frontend/
      dockerfile: Dockerfile
      args:
        BACKEND_URL: ${BACKEND_URL:-http://api:8000/api}
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - jera

networks:
  jera:
    driver: bridge