<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard FloraGest - Gerente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
        }

        :root {
            --floragest-terracotta: #B85C47;
            --floragest-terracotta-dark: #A0503D;
            --floragest-green-dark: #5E7C5B;
            --floragest-green-light: #A3B8A1;
            --floragest-cream: #F9F5EC;
            --floragest-text-dark: #3D352F;
            --floragest-text-light: #F9F5EC;
            --floragest-sidebar-bg: #B85C47;
            --floragest-sidebar-active-bg: #A0503D;
        }
        
        /* Classes utilitárias */
        .bg-floragest-terracotta { background-color: var(--floragest-terracotta); }
        .text-floragest-terracotta { color: var(--floragest-terracotta); }
        .bg-floragest-green-dark { background-color: var(--floragest-green-dark); }
        .text-floragest-green-dark { color: var(--floragest-green-dark); }
        
        /* Estilos da Sidebar */
        .sidebar {
            background-color: var(--floragest-sidebar-bg);
            transition: transform 0.3s ease-in-out;
        }
        .sidebar-link {
            transition: background-color 0.2s ease-in-out, padding-left 0.2s ease-in-out;
            color: var(--floragest-text-light);
        }
        .sidebar-link.active, .sidebar-link:hover {
            background-color: var(--floragest-sidebar-active-bg);
            border-left: 3px solid var(--floragest-cream);
            color: white;
            padding-left: calc(1.5rem - 3px);
        }
    </style>
</head>
<body class="bg-gray-100 text-floragest-text-dark">
    <div class="relative min-h-screen lg:flex">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar w-64 flex-col fixed inset-y-0 left-0 transform -translate-x-full lg:relative lg:translate-x-0 z-40">
            <div class="p-6 flex items-center justify-start border-b border-floragest-cream border-opacity-20">
                <svg class="h-10 w-auto" viewBox="0 0 110 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <text x="0" y="28" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#F9F5EC">FloraGest</text>
                </svg>
            </div>
            <nav class="mt-6 flex-1">
                <a href="#" class="sidebar-link flex items-center px-6 py-3 active">
                    <svg class="h-5 w-5 mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                    Dashboard
                </a>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header class="bg-white shadow-sm p-4">
                <div class="flex items-center justify-between">
                    <button id="sidebar-toggle" class="text-gray-500 hover:text-gray-700 lg:hidden">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <span class="text-xl font-semibold text-gray-700">Dashboard</span>
                     <div class="flex items-center space-x-4">
                        <button class="relative text-gray-500 hover:text-gray-700">
                            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                        </button>
                        <img class="h-8 w-8 rounded-full object-cover" src="https://placehold.co/100x100/5E7C5B/FFFFFF?text=G" alt="Avatar do Gerente">
                    </div>
                </div>
            </header>
            
            <!-- Área do Conteúdo Principal -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-4 md:p-6">
                <div class="max-w-7xl mx-auto">
                    <!-- Cards de KPIs -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mb-6">
                        <div class="bg-white p-4 rounded-lg shadow-sm flex flex-col items-start">
                            <h3 class="text-sm font-medium text-gray-500">Lotes Ativos</h3>
                            <p class="text-3xl font-bold text-floragest-text-dark mt-1">42</p>
                        </div>
 
                        <div class="bg-white p-4 rounded-lg shadow-sm flex flex-col items-start">
                            <h3 class="text-sm font-medium text-gray-500">Itens sem Giro</h3>
                            <p class="text-3xl font-bold text-yellow-500 mt-1">5</p>
                        </div>
                    </div>
                    
                    <!-- Gráficos -->
                    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6 mb-6">
                        <div class="lg:col-span-2 bg-white p-4 rounded-lg shadow-sm">
                            <h3 class="font-semibold text-gray-800 mb-2">Estado Estético Geral</h3>
                            <canvas id="estadoEsteticoChart"></canvas>
                        </div>
                        <div class="lg:col-span-3 bg-white p-4 rounded-lg shadow-sm">
                            <h3 class="font-semibold text-gray-800 mb-2">Top 5 Flores (Saídas no Mês)</h3>
                            <canvas id="topFloresChart"></canvas>
                        </div>
                    </div>

                     <!-- Lista de Lotes com Validade Próxima -->
                    <div class="bg-white rounded-lg shadow-sm">
                        <h3 class="font-semibold text-gray-800 p-4 border-b">Lotes com Validade Próxima</h3>
                        <ul class="divide-y divide-gray-200">
                           <li class="p-3 flex justify-between items-center text-sm hover:bg-gray-50">
                               <span>Lote #112 (Orquídea)</span>
                               <span class="font-bold text-red-600">Vence em 2 dias</span>
                           </li>
                           <li class="p-3 flex justify-between items-center text-sm hover:bg-gray-50">
                               <span>Lote #109 (Crisântemo)</span>
                               <span class="font-bold text-yellow-600">Vence em 5 dias</span>
                           </li>
                             <li class="p-3 flex justify-between items-center text-sm hover:bg-gray-50">
                               <span>Lote #115 (Margarida)</span>
                               <span class="font-bold text-yellow-600">Vence em 7 dias</span>
                           </li>
                        </ul>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <!-- JavaScript para Gráficos e Sidebar -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Lógica da Sidebar
            const sidebarToggle = document.getElementById('sidebar-toggle');
            const sidebar = document.getElementById('sidebar');
            if (sidebarToggle && sidebar) {
                sidebarToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    sidebar.classList.toggle('-translate-x-full');
                });
            }

            // Gráfico de Pizza (Estado Estético)
            const estadoEsteticoCtx = document.getElementById('estadoEsteticoChart');
            if(estadoEsteticoCtx) {
                new Chart(estadoEsteticoCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Ótimo', 'Regular', 'Ruim'],
                        datasets: [{
                            label: 'Estado Estético das Flores',
                            data: [65, 25, 10],
                            backgroundColor: [
                                'rgba(59, 130, 246, 0.7)',  // blue-500
                                'rgba(234, 179, 8, 0.7)',   // yellow-500
                                'rgba(239, 68, 68, 0.7)'    // red-500
                            ],
                            borderColor: '#fff',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'bottom',
                            },
                        }
                    }
                });
            }

            // Gráfico de Barras (Top Flores)
            const topFloresCtx = document.getElementById('topFloresChart');
            if(topFloresCtx) {
                new Chart(topFloresCtx, {
                    type: 'bar',
                    data: {
                        labels: ['Rosa Vermelha', 'Lírio Branco', 'Gérbera', 'Tulipa', 'Cravo'],
                        datasets: [{
                            label: 'Unidades Vendidas',
                            data: [120, 95, 75, 60, 45],
                            backgroundColor: 'rgba(94, 124, 91, 0.7)', // floragest-green-dark
                            borderColor: 'rgba(94, 124, 91, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        plugins: {
                           legend: {
                                display: false
                            }
                        },
                        scales: {
                            x: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
